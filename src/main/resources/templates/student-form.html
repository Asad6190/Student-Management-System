<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Student Form</title>
    <!-- RESTORED: Bootstrap CSS -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">

<!-- Dynamic Title: Says "Add" or "Edit" depending on the action -->
<h2 class="mb-4" th:text="${student.id == null ? 'Add New Student' : 'Edit Student'}">Add New Student</h2>

<form th:action="@{/students/save}" th:object="${student}" method="post" class="w-50">

    <!-- CRUCIAL: Hidden ID field. If editing, this passes the ID back to the controller -->
    <input type="hidden" th:field="*{id}" />

    <div class="mb-3">
        <label class="form-label">First Name:</label>
        <input type="text" th:field="*{firstName}" class="form-control" />
        <span th:if="${#fields.hasErrors('firstName')}" th:errors="*{firstName}" class="text-danger"></span>
    </div>
    <div class="mb-3">
        <label class="form-label">Last Name:</label>
        <input type="text" th:field="*{lastName}" class="form-control" />
        <span th:if="${#fields.hasErrors('lastName')}" th:errors="*{lastName}" class="text-danger"></span>
    </div>
    <div class="mb-3">
        <label class="form-label">Email:</label>
        <input type="email" th:field="*{email}" class="form-control" />
        <span th:if="${#fields.hasErrors('email')}" th:errors="*{email}" class="text-danger"></span>
    </div>
    <div class="mb-3">
        <label class="form-label">Course:</label>
        <input type="text" th:field="*{course}" class="form-control" />
        <span th:if="${#fields.hasErrors('course')}" th:errors="*{course}" class="text-danger"></span>
    </div>
    <button type="submit" class="btn btn-success">Save Student</button>
    <a href="/students" class="btn btn-secondary">Cancel</a>
</form>
</body>
</html>
