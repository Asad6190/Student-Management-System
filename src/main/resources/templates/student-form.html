<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Add New Student</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body class="container mt-5">
<h2 class="mb-4">Add New Student</h2>

<!-- This form sends data to the /save endpoint -->
<form th:action="@{/students/save}" th:object="${student}" method="post" class="w-50">
    <div class="mb-3">
        <label class="form-label">First Name:</label>
        <input type="text" th:field="*{firstName}" class="form-control" required />
    </div>
    <div class="mb-3">
        <label class="form-label">Last Name:</label>
        <input type="text" th:field="*{lastName}" class="form-control" required />
    </div>
    <div class="mb-3">
        <label class="form-label">Email:</label>
        <input type="email" th:field="*{email}" class="form-control" required />
    </div>
    <div class="mb-3">
        <label class="form-label">Course:</label>
        <input type="text" th:field="*{course}" class="form-control" required />
    </div>
    <button type="submit" class="btn btn-success">Save Student</button>
    <a href="/students" class="btn btn-secondary">Cancel</a>
</form>
</body>
</html>
